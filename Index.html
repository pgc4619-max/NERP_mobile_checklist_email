<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>NERP 네트워크 체크리스트</title><style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;color:#17191c;font-size:15px;min-width:0}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#810028,var(--brand2));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;box-shadow:0 3px 14px rgba(70,0,25,.25)}.top b{display:block;font-size:18px;line-height:1.3;margin-bottom:8px}.top #pct{font-size:12px;font-weight:800;text-align:right;margin-bottom:4px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.sum{border:0;border-radius:11px;padding:9px 4px;background:#fff;color:#25364a;font-weight:900;font-size:12px}.sum b{font-size:18px;margin:1px 0 0}.sum{cursor:pointer}.sum.ok{color:#087c55}.sum.bad{color:#c62c38}.sum.todo{color:#68717d}.sum.active{outline:3px solid rgba(255,255,255,.72);box-shadow:0 0 0 2px rgba(37,54,74,.28)}.bar{height:7px;background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:10px;transition:width .25s ease}.type-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 0;width:100%;max-width:480px;margin:auto;background:var(--bg)}.type-tabs button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#52606f;font-weight:900}.type-tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 12px 4px;width:100%;overflow:visible}.tabs button{min-width:0;min-height:52px;border:1px solid var(--line);border-radius:13px;background:#fff;color:#52606f;padding:8px 6px;font-size:12px;font-weight:800;line-height:1.25;white-space:normal;overflow-wrap:anywhere;box-shadow:0 2px 8px rgba(37,54,74,.05)}.tabs button small{display:block;margin-top:3px;color:#7a8591;font-size:10px}.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 5px 14px rgba(37,54,74,.25)}.tabs button.on small{color:#dce4ec}main{width:100%;max-width:720px;margin:auto;padding:6px 12px calc(92px + env(safe-area-inset-bottom))}.card{background:var(--card);margin:8px 0 12px;padding:15px;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 12px rgba(37,54,74,.06)}.card>input{margin:0 0 9px}.card>input:last-child{margin-bottom:0}.item{border-top:1px solid var(--line);padding:17px 0}.item:first-of-type{border-top:0}.item small{display:inline-block;color:var(--brand);font-weight:900;font-size:11px;background:#f8e7ed;padding:4px 7px;border-radius:7px}.q{font-size:15px;font-weight:800;line-height:1.5;margin:9px 0 12px}.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.seg label{display:flex;align-items:center;justify-content:center;min-width:0;min-height:42px;border:1px solid #d8dde3;border-radius:9px;padding:5px 1px;text-align:center;color:#64707d;font-size:10px;font-weight:800;line-height:1.15;background:#fff}.seg input{display:none}.seg input:checked+label{background:var(--navy);border-color:var(--navy);color:#fff}.detail{display:none;background:#fff8ed;border:1px solid #f3dfb8;border-radius:11px;padding:10px;margin-top:10px}.detail.show{display:block}input,textarea,select{display:block;width:100%;max-width:100%;box-sizing:border-box;border:1px solid #ccd3db;border-radius:10px;background:#fff;padding:12px;font:inherit;font-size:16px;color:#17191c;appearance:none}textarea{min-height:82px;resize:vertical;margin:0 0 8px}input:focus,textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(165,0,52,.09)}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:11px 13px;font:inherit;font-size:13px;font-weight:800;background:#e9edf1;color:#334;cursor:pointer}.item>.btn{margin-top:10px;min-height:42px}.photo-tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.photo-count{grid-column:1/-1;font-size:11px;font-weight:800;color:#52606f}.save-ok{color:#087c55}.save-bad{color:#c62c38}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.photo{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#eef1f4}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:3px;top:3px;width:25px;height:25px;border:0;border-radius:50%;background:rgba(0,0,0,.68);color:#fff}.seq{display:inline-block;color:var(--brand);font-weight:900;font-size:11px;background:#f8e7ed;padding:4px 7px;border-radius:7px}.email-row{margin-top:9px}.ios-note{display:none;margin:8px 0 0;padding:9px 10px;border-radius:9px;background:#fff4cf;color:#695000;font-size:11px;font-weight:800;line-height:1.45}.ios-note.show{display:block}.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;width:100%;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:9px 10px max(9px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;box-shadow:0 -4px 16px rgba(37,54,74,.08)}.foot .btn{width:100%;min-width:0;padding:12px 4px;font-size:12px}.foot .primary{background:var(--brand);color:#fff}.primary{background:var(--brand);color:#fff}

/* Phone-first application shell */

.type-tabs-top{padding:2px 0 10px;max-width:none;background:transparent;margin:0}.type-tabs-top button{background:rgba(255,255,255,.96);border-color:rgba(255,255,255,.75);color:#596572;box-shadow:0 2px 7px rgba(76,0,27,.16)}.type-tabs-top button.on{background:#fff;border-color:#fff;color:var(--brand);box-shadow:0 0 0 3px rgba(255,255,255,.25),0 3px 9px rgba(76,0,27,.2)}</style></head><body><div class="top"><b>NERP 해외서비스<br>네트워크 TEST</b><div id="storageState" style="font-size:10px;font-weight:800;margin-bottom:5px">사진 저장소 점검 중...</div><div id="iosNotice" class="ios-note"></div><div class="type-tabs type-tabs-top" id="typeTabs"><button id="typeOne" onclick="setType('1회성확인')">1회성 확인</button><button id="typeDaily" onclick="setType('일상점검')">일상점검</button></div><div id="pct">0%</div><div class="summary"><button class="sum ok" onclick="showStatus('P')">적합<b id="cntP">0</b></button><button class="sum bad" onclick="showStatus('F')">부적합<b id="cntF">0</b></button><button class="sum todo" onclick="showStatus('U')">미점검<b id="cntU">0</b></button></div><div class="bar"><i id="b"></i></div></div><div class="tabs" id="tabs"></div><main><div class="card"><div style="font-weight:900;margin-bottom:10px">점검 기본정보</div><label style="font-size:11px;font-weight:800;color:#68717d">국가 / 법인</label><input id="country" placeholder="예: Egypt / LGEEG"><label style="font-size:11px;font-weight:800;color:#68717d">서비스센터</label><input id="center" placeholder="센터명 입력"><label style="font-size:11px;font-weight:800;color:#68717d">점검자</label><input id="inspector" placeholder="점검자 이름"><label style="font-size:11px;font-weight:800;color:#68717d">점검일</label><input id="date" type="date"><div class="email-row"><label style="font-size:11px;font-weight:800;color:#68717d">결과 수신 이메일</label><input id="recipientEmail" type="email" placeholder="예: recipient@company.com"><div style="font-size:11px;color:#68717d;margin-top:7px;line-height:1.5">이메일 발송을 누르면 ZIP이 저장됩니다. 다음 단계에서 메일 앱을 열어 ZIP을 직접 첨부하고 발송하세요.</div><div id="mailD
